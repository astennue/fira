<!-- Frame: FIRA Form Elements — Dark Mode -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800">
  <defs>
    <style>
      text { font-family: 'Inter', sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="1800" fill="#0b1120"/>

  <!-- Title Bar -->
  <rect width="1440" height="56" fill="#141c2e"/>
  <rect y="54" width="1440" height="2" fill="#1e2d4a"/>
  <text x="80" y="36" font-size="20" font-weight="700" fill="#60a5fa">FIRA Form Elements — Dark Mode</text>

  <!-- ==================== SECTION A: TEXT INPUTS ==================== -->
  <text x="80" y="96" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">TEXT INPUTS — 36px height, rounded-md (8px)</text>

  <!-- A1: Default Input -->
  <text x="80" y="126" font-size="13" font-weight="500" fill="#e2e8f0">Full Name</text>
  <rect x="80" y="136" width="400" height="36" rx="8" fill="#141c2e" stroke="#1e2d4a" stroke-width="1"/>
  <text x="92" y="159" font-size="14" fill="#5a6e8a">Enter your name...</text>
  <text x="500" y="159" class="mono" font-size="11" fill="#8899b4">Default — border-input</text>

  <!-- A2: Filled Input -->
  <text x="80" y="200" font-size="13" font-weight="500" fill="#e2e8f0">Full Name</text>
  <rect x="80" y="210" width="400" height="36" rx="8" fill="#141c2e" stroke="#1e2d4a" stroke-width="1"/>
  <text x="92" y="233" font-size="14" fill="#e2e8f0">Juan Dela Cruz</text>
  <text x="500" y="233" class="mono" font-size="11" fill="#8899b4">Filled — value present</text>

  <!-- A3: Focused Input -->
  <text x="80" y="274" font-size="13" font-weight="500" fill="#e2e8f0">Email Address</text>
  <!-- Focus ring -->
  <rect x="77" y="278" width="406" height="42" rx="10" fill="#3b82f6" opacity="0.15"/>
  <rect x="80" y="281" width="400" height="36" rx="8" fill="#141c2e" stroke="#3b82f6" stroke-width="2"/>
  <text x="92" y="304" font-size="14" fill="#e2e8f0">user@example.com</text>
  <text x="500" y="304" class="mono" font-size="11" fill="#8899b4">Focus — border-ring + ring-3px ring-ring/50</text>

  <!-- A4: Error Input -->
  <text x="80" y="350" font-size="13" font-weight="500" fill="#e2e8f0">Username</text>
  <!-- Error ring -->
  <rect x="77" y="354" width="406" height="42" rx="10" fill="#f87171" opacity="0.1"/>
  <rect x="80" y="357" width="400" height="36" rx="8" fill="#141c2e" stroke="#f87171" stroke-width="2"/>
  <text x="92" y="380" font-size="14" fill="#e2e8f0">invalid-</text>
  <text x="92" y="410" font-size="12" fill="#f87171">⚠ Please enter a valid value</text>
  <text x="500" y="380" class="mono" font-size="11" fill="#8899b4">Error — border-destructive +</text>
  <text x="500" y="394" class="mono" font-size="11" fill="#8899b4">ring-destructive/20 + error message</text>

  <!-- A5: Disabled Input -->
  <text x="80" y="440" font-size="13" font-weight="500" fill="#e2e8f0">API Key</text>
  <g opacity="0.5">
    <rect x="80" y="450" width="400" height="36" rx="8" fill="#0b1120" stroke="#1e2d4a" stroke-width="1"/>
    <text x="92" y="473" font-size="14" fill="#5a6e8a">Cannot edit</text>
  </g>
  <text x="500" y="473" class="mono" font-size="11" fill="#8899b4">Disabled — opacity-50 cursor-not-allowed</text>

  <!-- ==================== SECTION B: TEXTAREA ==================== -->
  <text x="80" y="540" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">TEXTAREA</text>

  <text x="80" y="570" font-size="13" font-weight="500" fill="#e2e8f0">Message</text>
  <rect x="80" y="580" width="500" height="100" rx="8" fill="#141c2e" stroke="#1e2d4a" stroke-width="1"/>
  <text x="92" y="604" font-size="14" fill="#5a6e8a">Type your message here...</text>
  <text x="92" y="696" font-size="12" fill="#8899b4">Max 500 characters</text>
  <text x="600" y="636" class="mono" font-size="11" fill="#8899b4">min-h-16 field-sizing-content</text>

  <!-- ==================== SECTION C: CHECKBOXES ==================== -->
  <text x="80" y="748" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">CHECKBOXES</text>

  <!-- Checked Checkbox -->
  <rect x="80" y="770" width="18" height="18" rx="4" fill="#60a5fa"/>
  <text x="89" y="784" font-size="13" font-weight="700" fill="#0b1120" text-anchor="middle">✓</text>
  <text x="108" y="784" font-size="14" fill="#e2e8f0">Accept terms</text>
  <text x="80" y="804" class="mono" font-size="11" fill="#8899b4">Checked — bg-primary, accent-primary</text>

  <!-- Unchecked Checkbox -->
  <rect x="280" y="770" width="18" height="18" rx="4" fill="#141c2e" stroke="#1e2d4a" stroke-width="1.5"/>
  <text x="308" y="784" font-size="14" fill="#e2e8f0">Remember me</text>
  <text x="280" y="804" class="mono" font-size="11" fill="#8899b4">Unchecked — border-input</text>

  <!-- Disabled Checkbox -->
  <g opacity="0.5">
    <rect x="480" y="770" width="18" height="18" rx="4" fill="#141c2e" stroke="#1e2d4a" stroke-width="1.5"/>
    <text x="508" y="784" font-size="14" fill="#e2e8f0">Subscribe</text>
  </g>
  <text x="480" y="804" class="mono" font-size="11" fill="#8899b4">Disabled — opacity-50</text>

  <!-- ==================== SECTION D: RADIO BUTTONS ==================== -->
  <text x="80" y="850" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">RADIO BUTTONS</text>

  <!-- Selected Radio -->
  <circle cx="89" cy="876" r="9" fill="#141c2e" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="89" cy="876" r="5" fill="#60a5fa"/>
  <text x="108" y="881" font-size="14" fill="#e2e8f0">Option A</text>
  <text x="80" y="904" class="mono" font-size="11" fill="#8899b4">Selected — accent-primary</text>

  <!-- Unselected Radio -->
  <circle cx="289" cy="876" r="9" fill="#141c2e" stroke="#1e2d4a" stroke-width="1.5"/>
  <text x="308" y="881" font-size="14" fill="#e2e8f0">Option B</text>
  <text x="280" y="904" class="mono" font-size="11" fill="#8899b4">Unchecked</text>

  <!-- Disabled Radio -->
  <g opacity="0.5">
    <circle cx="489" cy="876" r="9" fill="#141c2e" stroke="#1e2d4a" stroke-width="1.5"/>
    <text x="508" y="881" font-size="14" fill="#e2e8f0">Option C</text>
  </g>
  <text x="480" y="904" class="mono" font-size="11" fill="#8899b4">Disabled</text>

  <!-- ==================== SECTION E: SWITCH / TOGGLE ==================== -->
  <text x="80" y="950" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">SWITCH / TOGGLE</text>

  <!-- Switch On -->
  <rect x="80" y="972" width="44" height="24" rx="9999" fill="#60a5fa"/>
  <circle cx="104" cy="984" r="10" fill="#0b1120"/>
  <text x="136" y="989" font-size="14" fill="#e2e8f0">Notifications enabled</text>
  <text x="80" y="1014" class="mono" font-size="11" fill="#8899b4">On — bg-primary</text>

  <!-- Switch Off -->
  <rect x="300" y="972" width="44" height="24" rx="9999" fill="#1e2d4a"/>
  <circle cx="312" cy="984" r="10" fill="#8899b4"/>
  <text x="356" y="989" font-size="14" fill="#e2e8f0">Dark mode</text>
  <text x="300" y="1014" class="mono" font-size="11" fill="#8899b4">Off — bg-input</text>

  <!-- ==================== SECTION F: FILE UPLOAD ==================== -->
  <text x="80" y="1060" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">FILE UPLOAD ZONE</text>

  <!-- Upload zone -->
  <rect x="80" y="1080" width="240" height="160" rx="12" fill="#141c2e" stroke="#1e2d4a" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- File icon -->
  <rect x="172" y="1110" width="32" height="40" rx="4" fill="#1a2540" stroke="#1e2d4a" stroke-width="1"/>
  <path d="M192 1110 L204 1122 L204 1110 Z" fill="#1e293b" stroke="#1e2d4a" stroke-width="0.5"/>
  <path d="M192 1110 L192 1122 L204 1122" fill="none" stroke="#1e2d4a" stroke-width="0.5"/>
  <line x1="180" y1="1130" x2="196" y2="1130" stroke="#5a6e8a" stroke-width="1"/>
  <line x1="180" y1="1136" x2="196" y2="1136" stroke="#5a6e8a" stroke-width="1"/>
  <line x1="180" y1="1142" x2="192" y2="1142" stroke="#5a6e8a" stroke-width="1"/>

  <text x="200" y="1172" font-size="14" font-weight="500" fill="#e2e8f0" text-anchor="middle">Drop your file here</text>
  <text x="200" y="1192" font-size="12" fill="#8899b4" text-anchor="middle">PDF, DOCX, JPG, PNG — Max 10MB</text>

  <text x="80" y="1264" class="mono" font-size="11" fill="#8899b4">border-2 border-dashed border-input,</text>
  <text x="80" y="1278" class="mono" font-size="11" fill="#8899b4">hover: border-primary bg-primary/5</text>

  <!-- ==================== SECTION G: FORM IN CONTEXT ==================== -->
  <text x="80" y="1320" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">FORM — COMPOSITE EXAMPLE</text>

  <!-- Form Card -->
  <rect x="80" y="1340" width="600" height="420" rx="12" fill="#141c2e" stroke="#1e2d4a" stroke-width="1"/>

  <!-- Form title -->
  <text x="112" y="1374" font-size="18" font-weight="700" fill="#e2e8f0">Create Account</text>
  <text x="112" y="1396" font-size="13" fill="#8899b4">Fill in the details below to get started.</text>

  <!-- Divider -->
  <line x1="112" y1="1412" x2="648" y2="1412" stroke="#1e2d4a" stroke-width="1"/>

  <!-- Form Row: First Name / Last Name -->
  <text x="112" y="1438" font-size="12" font-weight="500" fill="#e2e8f0">First Name</text>
  <rect x="112" y="1446" width="248" height="36" rx="8" fill="#141c2e" stroke="#1e2d4a" stroke-width="1"/>
  <text x="124" y="1469" font-size="13" fill="#e2e8f0">Juan</text>

  <text x="384" y="1438" font-size="12" font-weight="500" fill="#e2e8f0">Last Name</text>
  <rect x="384" y="1446" width="264" height="36" rx="8" fill="#141c2e" stroke="#1e2d4a" stroke-width="1"/>
  <text x="396" y="1469" font-size="13" fill="#e2e8f0">Dela Cruz</text>

  <!-- Email -->
  <text x="112" y="1510" font-size="12" font-weight="500" fill="#e2e8f0">Email</text>
  <rect x="112" y="1518" width="536" height="36" rx="8" fill="#141c2e" stroke="#1e2d4a" stroke-width="1"/>
  <text x="124" y="1541" font-size="13" fill="#e2e8f0">juan@example.com</text>

  <!-- Password -->
  <text x="112" y="1582" font-size="12" font-weight="500" fill="#e2e8f0">Password</text>
  <rect x="112" y="1590" width="536" height="36" rx="8" fill="#141c2e" stroke="#1e2d4a" stroke-width="1"/>
  <text x="124" y="1613" font-size="13" fill="#5a6e8a">••••••••</text>

  <!-- Checkbox + Switch in row -->
  <rect x="112" y="1648" width="18" height="18" rx="4" fill="#60a5fa"/>
  <text x="121" y="1662" font-size="12" font-weight="700" fill="#0b1120" text-anchor="middle">✓</text>
  <text x="140" y="1662" font-size="13" fill="#e2e8f0">I agree to the terms and conditions</text>

  <rect x="480" y="1650" width="44" height="24" rx="9999" fill="#60a5fa"/>
  <circle cx="504" cy="1662" r="10" fill="#0b1120"/>
  <text x="536" y="1667" font-size="13" fill="#e2e8f0">Newsletter</text>

  <!-- Submit button -->
  <rect x="112" y="1696" width="160" height="40" rx="8" fill="#60a5fa"/>
  <text x="192" y="1721" font-size="14" font-weight="500" fill="#0b1120" text-anchor="middle">Create Account</text>

  <!-- Cancel link -->
  <text x="288" y="1721" font-size="14" fill="#60a5fa">Cancel</text>

  <!-- Form labels on the right side -->
  <g transform="translate(720, 1340)">
    <rect width="400" height="420" rx="12" fill="#0b1120" stroke="#1e2d4a" stroke-width="1"/>
    <text x="24" y="32" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">COMPOSITE FORM SPECS</text>
    <line x1="24" y1="44" x2="376" y2="44" stroke="#1e2d4a" stroke-width="1"/>

    <text x="24" y="72" class="mono" font-size="11" fill="#8899b4">Layout: grid grid-cols-2 gap-4</text>
    <text x="24" y="92" class="mono" font-size="11" fill="#8899b4">Card: bg-card rounded-xl border</text>
    <text x="24" y="112" class="mono" font-size="11" fill="#8899b4">Title: text-lg font-bold</text>
    <text x="24" y="132" class="mono" font-size="11" fill="#8899b4">Description: text-sm text-muted</text>
    <text x="24" y="152" class="mono" font-size="11" fill="#8899b4">Label: text-xs font-medium</text>
    <text x="24" y="172" class="mono" font-size="11" fill="#8899b4">Input: h-9 rounded-md border-input</text>
    <text x="24" y="192" class="mono" font-size="11" fill="#8899b4">Password: type=password, bullets</text>

    <text x="24" y="224" font-size="12" font-weight="600" fill="#e2e8f0">Components used:</text>
    <text x="24" y="244" class="mono" font-size="11" fill="#8899b4">• Input (text, email, password)</text>
    <text x="24" y="264" class="mono" font-size="11" fill="#8899b4">• Checkbox (terms)</text>
    <text x="24" y="284" class="mono" font-size="11" fill="#8899b4">• Switch (newsletter toggle)</text>
    <text x="24" y="304" class="mono" font-size="11" fill="#8899b4">• Button (primary submit)</text>
    <text x="24" y="324" class="mono" font-size="11" fill="#8899b4">• Link (cancel action)</text>

    <text x="24" y="360" font-size="12" font-weight="600" fill="#e2e8f0">Spacing tokens:</text>
    <text x="24" y="380" class="mono" font-size="11" fill="#8899b4">• gap-y-4 (16px vertical)</text>
    <text x="24" y="400" class="mono" font-size="11" fill="#8899b4">• gap-x-4 (16px horizontal)</text>
  </g>

  <!-- Footer note -->
  <text x="80" y="1780" class="mono" font-size="11" fill="#4a5e7a">All form elements use focus-visible:ring-2 ring-ring ring-offset-2. Labels use text-sm font-medium. Error messages: text-xs text-destructive. Helper text: text-xs text-muted-foreground.</text>
</svg>