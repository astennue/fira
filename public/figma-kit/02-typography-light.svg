<!-- Frame: FIRA Typography — Light Mode -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800">
  <defs>
    <style>
      text { font-family: 'Inter, sans-serif'; }
      .mono { font-family: 'JetBrains Mono, monospace'; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="1800" fill="#f8fafc"/>

  <!-- Title Bar -->
  <rect width="1440" height="60" fill="#ffffff"/>
  <line x1="0" y1="60" x2="1440" y2="60" stroke="#cbd5e1" stroke-width="1"/>
  <text x="720" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1e40af" font-family="Inter, sans-serif">FIRA Typography — Light Mode</text>

  <!-- Vertical divider between left and right columns -->
  <line x1="870" y1="80" x2="870" y2="1750" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ========================================= -->
  <!-- LEFT COLUMN: Type Scale Specimens        -->
  <!-- ========================================= -->

  <!-- Section label -->
  <text x="60" y="95" font-size="12" font-weight="600" fill="#64748b" letter-spacing="0.05em" font-family="Inter, sans-serif">TYPE SCALE</text>

  <!-- Row: H1 -->
  <text x="60" y="148" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.05em" font-family="Inter, sans-serif">H1</text>
  <text x="170" y="148" font-size="36" font-weight="700" fill="#0f172a" letter-spacing="-0.02em" font-family="Inter, sans-serif">Heading One</text>
  <text x="850" y="148" text-anchor="end" font-size="12" fill="#64748b" font-family="JetBrains Mono, monospace">36px / Bold 700 / line: 1.2</text>
  <line x1="60" y1="178" x2="850" y2="178" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row: H2 -->
  <text x="60" y="228" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.05em" font-family="Inter, sans-serif">H2</text>
  <text x="170" y="228" font-size="30" font-weight="600" fill="#0f172a" letter-spacing="-0.01em" font-family="Inter, sans-serif">Heading Two</text>
  <text x="850" y="228" text-anchor="end" font-size="12" fill="#64748b" font-family="JetBrains Mono, monospace">30px / Semibold 600 / line: 1.25</text>
  <line x1="60" y1="255" x2="850" y2="255" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row: H3 -->
  <text x="60" y="298" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.05em" font-family="Inter, sans-serif">H3</text>
  <text x="170" y="298" font-size="20" font-weight="600" fill="#0f172a" font-family="Inter, sans-serif">Heading Three</text>
  <text x="850" y="298" text-anchor="end" font-size="12" fill="#64748b" font-family="JetBrains Mono, monospace">20px / Semibold 600 / line: 1.3</text>
  <line x1="60" y1="320" x2="850" y2="320" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row: H4 -->
  <text x="60" y="362" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.05em" font-family="Inter, sans-serif">H4</text>
  <text x="170" y="362" font-size="18" font-weight="600" fill="#0f172a" font-family="Inter, sans-serif">Heading Four</text>
  <text x="850" y="362" text-anchor="end" font-size="12" fill="#64748b" font-family="JetBrains Mono, monospace">18px / Semibold 600 / line: 1.35</text>
  <line x1="60" y1="382" x2="850" y2="382" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row: H5 -->
  <text x="60" y="420" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.05em" font-family="Inter, sans-serif">H5</text>
  <text x="170" y="420" font-size="16" font-weight="500" fill="#0f172a" font-family="Inter, sans-serif">Heading Five</text>
  <text x="850" y="420" text-anchor="end" font-size="12" fill="#64748b" font-family="JetBrains Mono, monospace">16px / Medium 500 / line: 1.4</text>
  <line x1="60" y1="440" x2="850" y2="440" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row: H6 -->
  <text x="60" y="478" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.05em" font-family="Inter, sans-serif">H6</text>
  <text x="170" y="478" font-size="14" font-weight="500" fill="#0f172a" letter-spacing="0.01em" font-family="Inter, sans-serif">HEADING SIX</text>
  <text x="850" y="478" text-anchor="end" font-size="12" fill="#64748b" font-family="JetBrains Mono, monospace">14px / Medium 500 / tracking: 0.01em</text>
  <line x1="60" y1="498" x2="850" y2="498" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row: Body -->
  <text x="60" y="540" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.05em" font-family="Inter, sans-serif">BODY</text>
  <text x="170" y="540" font-size="16" font-weight="400" fill="#0f172a" font-family="Inter, sans-serif">The quick brown fox jumps over the lazy dog.</text>
  <text x="850" y="540" text-anchor="end" font-size="12" fill="#64748b" font-family="JetBrains Mono, monospace">16px / Regular 400 / line: 1.6</text>
  <line x1="60" y1="565" x2="850" y2="565" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row: Body SM -->
  <text x="60" y="600" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.05em" font-family="Inter, sans-serif">BODY SM</text>
  <text x="170" y="600" font-size="14" font-weight="400" fill="#64748b" font-family="Inter, sans-serif">Secondary content text for descriptions and helper text.</text>
  <text x="850" y="600" text-anchor="end" font-size="12" fill="#64748b" font-family="JetBrains Mono, monospace">14px / Regular 400 / line: 1.5</text>
  <line x1="60" y1="622" x2="850" y2="622" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row: Caption -->
  <text x="60" y="654" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.05em" font-family="Inter, sans-serif">CAPTION</text>
  <text x="170" y="654" font-size="12" font-weight="400" fill="#64748b" letter-spacing="0.02em" font-family="Inter, sans-serif">Meta info • Timestamp • Helper text</text>
  <text x="850" y="654" text-anchor="end" font-size="12" fill="#64748b" font-family="JetBrains Mono, monospace">12px / Regular 400 / tracking: 0.02em</text>
  <line x1="60" y1="674" x2="850" y2="674" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row: Overline -->
  <text x="60" y="706" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.05em" font-family="Inter, sans-serif">OVERLINE</text>
  <text x="170" y="706" font-size="12" font-weight="500" fill="#1e40af" letter-spacing="0.05em" font-family="Inter, sans-serif">SECTION LABEL — EYEBROW</text>
  <text x="850" y="706" text-anchor="end" font-size="12" fill="#64748b" font-family="JetBrains Mono, monospace">12px / Medium 500 / uppercase / tracking: 0.05em</text>
  <line x1="60" y1="726" x2="850" y2="726" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row: Mono -->
  <text x="60" y="762" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.05em" font-family="Inter, sans-serif">MONO</text>
  <text x="170" y="762" font-size="14" font-weight="400" fill="#0f172a" font-family="JetBrains Mono, monospace">const data = await fetch('/api/jobs');</text>
  <text x="850" y="762" text-anchor="end" font-size="12" fill="#64748b" font-family="JetBrains Mono, monospace">14px / Geist Mono / Regular 400</text>

  <!-- ========================================= -->
  <!-- RIGHT COLUMN: Text Color Hierarchy       -->
  <!-- ========================================= -->

  <text x="900" y="95" font-size="12" font-weight="600" fill="#64748b" letter-spacing="0.05em" font-family="Inter, sans-serif">TEXT COLOR HIERARCHY</text>

  <!-- Row 1: Primary text -->
  <text x="900" y="148" font-size="16" font-weight="500" fill="#0f172a" font-family="Inter, sans-serif">Primary text</text>
  <text x="900" y="172" font-size="12" fill="#64748b" font-family="JetBrains Mono, monospace">text-foreground</text>
  <text x="900" y="190" font-size="12" fill="#64748b" font-family="JetBrains Mono, monospace">#0f172a</text>
  <rect x="1100" y="135" width="16" height="16" rx="4" ry="4" fill="#0f172a"/>
  <text x="1128" y="148" font-size="14" fill="#0f172a" font-family="Inter, sans-serif">The primary text color used for headings, body copy, and important interface elements.</text>
  <line x1="900" y1="210" x2="1380" y2="210" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 2: Secondary text -->
  <text x="900" y="248" font-size="16" font-weight="500" fill="#64748b" font-family="Inter, sans-serif">Secondary text</text>
  <text x="900" y="272" font-size="12" fill="#94a3b8" font-family="JetBrains Mono, monospace">text-muted-foreground</text>
  <text x="900" y="290" font-size="12" fill="#94a3b8" font-family="JetBrains Mono, monospace">#64748b</text>
  <rect x="1100" y="235" width="16" height="16" rx="4" ry="4" fill="#64748b"/>
  <text x="1128" y="248" font-size="14" fill="#64748b" font-family="Inter, sans-serif">Used for descriptions, helper text, labels, and less prominent content.</text>
  <line x1="900" y1="310" x2="1380" y2="310" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 3: Tertiary text -->
  <text x="900" y="348" font-size="16" font-weight="500" fill="#94a3b8" font-family="Inter, sans-serif">Tertiary text</text>
  <text x="900" y="372" font-size="12" fill="#cbd5e1" font-family="JetBrains Mono, monospace">slate-400</text>
  <text x="900" y="390" font-size="12" fill="#cbd5e1" font-family="JetBrains Mono, monospace">#94a3b8</text>
  <rect x="1100" y="335" width="16" height="16" rx="4" ry="4" fill="#94a3b8"/>
  <text x="1128" y="348" font-size="14" fill="#94a3b8" font-family="Inter, sans-serif">Subtle placeholders, disabled-looking but still readable content.</text>
  <line x1="900" y1="410" x2="1380" y2="410" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 4: Disabled text -->
  <text x="900" y="448" font-size="16" font-weight="500" fill="#cbd5e1" font-family="Inter, sans-serif">Disabled text</text>
  <text x="900" y="472" font-size="12" fill="#e2e8f0" font-family="JetBrains Mono, monospace">slate-300</text>
  <text x="900" y="490" font-size="12" fill="#e2e8f0" font-family="JetBrains Mono, monospace">#cbd5e1</text>
  <rect x="1100" y="435" width="16" height="16" rx="4" ry="4" fill="#cbd5e1" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1128" y="448" font-size="14" fill="#cbd5e1" font-family="Inter, sans-serif">Disabled state text, non-interactive or inactive elements.</text>
  <line x1="900" y1="510" x2="1380" y2="510" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 5: Inverse text -->
  <rect x="900" y="535" width="480" height="56" rx="10" ry="10" fill="#1e40af"/>
  <text x="920" y="569" font-size="16" font-weight="500" fill="#ffffff" font-family="Inter, sans-serif">Inverse text</text>
  <text x="1150" y="569" font-size="12" fill="rgba(255,255,255,0.7)" font-family="JetBrains Mono, monospace">text-primary-foreground · #ffffff on #1e40af</text>

</svg>