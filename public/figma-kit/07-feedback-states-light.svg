<!-- Frame: Feedback & States — Light Mode -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1400" viewBox="0 0 1440 1400" font-family="Inter, sans-serif">
<!-- Title Bar -->
<rect width="1440" height="60" fill="#ffffff" stroke="#cbd5e1" stroke-width="0 0 2 0"/>
<rect y="58" width="1440" height="2" fill="#cbd5e1"/>
<text x="40" y="38" font-size="20" font-weight="700" fill="#1e40af">FIRA Feedback &amp; States — Light Mode</text>

<!-- Section A: TOASTS -->
<text x="40" y="105" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#64748b" font-family="JetBrains Mono, monospace">TOASTS — border-left colored, auto-dismiss 4-5s, shadow-lg</text>

<!-- Success Toast -->
<rect x="40" y="125" width="400" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="125" width="4" height="72" rx="2" fill="#22c55e"/>
<text x="68" y="150" font-size="18" fill="#22c55e" font-weight="700">✓</text>
<text x="94" y="152" font-size="14" font-weight="600" fill="#0f172a">Success</text>
<text x="94" y="172" font-size="13" fill="#64748b">Application submitted successfully.</text>
<text x="460" y="155" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">border-l-4 border-l-green-500</text>

<!-- Error Toast -->
<rect x="40" y="215" width="400" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="215" width="4" height="72" rx="2" fill="#ef4444"/>
<text x="68" y="240" font-size="18" fill="#ef4444" font-weight="700">✕</text>
<text x="94" y="242" font-size="14" font-weight="600" fill="#0f172a">Error</text>
<text x="94" y="262" font-size="13" fill="#64748b">Failed to save changes. Please try again.</text>
<text x="460" y="245" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">border-l-4 border-l-red-500</text>

<!-- Warning Toast -->
<rect x="40" y="305" width="400" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="305" width="4" height="72" rx="2" fill="#f59e0b"/>
<text x="68" y="330" font-size="18" fill="#f59e0b" font-weight="700">◐</text>
<text x="94" y="332" font-size="14" font-weight="600" fill="#0f172a">Warning</text>
<text x="94" y="352" font-size="13" fill="#64748b">Your session will expire in 5 minutes.</text>
<text x="460" y="335" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">border-l-4 border-l-amber-500</text>

<!-- Info Toast -->
<rect x="40" y="395" width="400" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40" y="395" width="4" height="72" rx="2" fill="#3b82f6"/>
<text x="68" y="420" font-size="18" fill="#3b82f6" font-weight="700">ℹ</text>
<text x="94" y="422" font-size="14" font-weight="600" fill="#0f172a">Info</text>
<text x="94" y="442" font-size="13" fill="#64748b">A new version is available.</text>
<text x="460" y="425" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">border-l-4 border-l-blue-500</text>

<!-- Section B: LOADING STATES -->
<text x="40" y="510" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#64748b" font-family="JetBrains Mono, monospace">LOADING STATES</text>

<!-- Spinner -->
<circle cx="80" cy="570" r="16" fill="none" stroke="#cbd5e1" stroke-width="3"/>
<path d="M 80 554 A 16 16 0 0 1 96 570" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
<text x="40" y="605" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">Spinner — size-8 (32px)</text>
<text x="40" y="620" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">animate-spin, stroke-primary</text>

<!-- Button Loading -->
<rect x="280" y="550" width="120" height="36" rx="8" fill="#1e40af"/>
<circle cx="340" cy="568" r="8" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"/>
<path d="M 340 560 A 8 8 0 0 1 348 568" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
<text x="280" y="605" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">Button Loading</text>
<text x="280" y="620" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">text hidden, spinner icon</text>

<!-- Skeleton -->
<rect x="520" y="550" width="120" height="12" rx="6" fill="#e2e8f0"/>
<rect x="520" y="572" width="160" height="12" rx="6" fill="#e2e8f0"/>
<rect x="520" y="594" width="80" height="12" rx="6" fill="#e2e8f0"/>
<text x="520" y="625" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">Skeleton — bg-muted</text>
<text x="520" y="640" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">animate-pulse, rounded-6px</text>

<!-- Section C: EMPTY STATES -->
<text x="40" y="700" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#64748b" font-family="JetBrains Mono, monospace">EMPTY STATES — centered, py-12, muted icon</text>

<!-- Empty Jobs -->
<rect x="40" y="720" width="320" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="200" y="790" font-size="48" fill="#cbd5e1" text-anchor="middle">📋</text>
<text x="200" y="830" font-size="18" font-weight="500" fill="#0f172a" text-anchor="middle">No jobs found</text>
<text x="200" y="855" font-size="14" fill="#64748b" text-anchor="middle">Try adjusting your search or filters.</text>
<rect x="152" y="875" width="96" height="32" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1"/>
<text x="200" y="896" font-size="13" fill="#0f172a" text-anchor="middle">Browse Jobs</text>
<text x="40" y="960" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">icon: size-12 (48px) text-muted-foreground/50</text>

<!-- Empty Messages -->
<rect x="420" y="720" width="320" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="580" y="790" font-size="48" fill="#cbd5e1" text-anchor="middle">💬</text>
<text x="580" y="830" font-size="18" font-weight="500" fill="#0f172a" text-anchor="middle">No messages yet</text>
<text x="580" y="855" font-size="14" fill="#64748b" text-anchor="middle">Your conversations will appear here.</text>

<!-- Section D: ERROR STATES -->
<text x="40" y="1010" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#64748b" font-family="JetBrains Mono, monospace">ERROR STATES</text>

<!-- Field Error -->
<text x="40" y="1040" font-size="13" font-weight="500" fill="#0f172a">Email</text>
<rect x="40" y="1050" width="320" height="36" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
<rect x="37" y="1047" width="326" height="42" rx="10" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.2"/>
<text x="56" y="1074" font-size="14" fill="#0f172a">not-an-email</text>
<text x="40" y="1106" font-size="12" fill="#ef4444">⚠ Please enter a valid email address.</text>
<text x="400" y="1060" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">border-destructive</text>
<text x="400" y="1075" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">ring-3px ring-destructive/20</text>
<text x="400" y="1090" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">+ error message text-sm</text>

<!-- Alert Error -->
<rect x="40" y="1130" width="360" height="72" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
<text x="64" y="1158" font-size="14" font-weight="600" fill="#ef4444">Something went wrong</text>
<text x="64" y="1178" font-size="13" fill="#dc2626">Unable to load data. Please check your connection.</text>
<text x="420" y="1160" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">Alert: bg-destructive-bg</text>
<text x="420" y="1175" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">border-destructive</text>

<!-- Success State -->
<text x="40" y="1240" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#64748b" font-family="JetBrains Mono, monospace">SUCCESS STATE</text>
<circle cx="80" cy="1280" r="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
<text x="80" y="1286" font-size="16" fill="#22c55e" text-anchor="middle" font-weight="700">✓</text>
<text x="110" y="1286" font-size="15" font-weight="500" fill="#0f172a">Profile saved successfully!</text>
<text x="340" y="1286" font-size="11" fill="#64748b" font-family="JetBrains Mono, monospace">green checkmark + text</text>

</svg>