<!-- Frame: FIRA Interactive Elements — Light Mode -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1600" viewBox="0 0 1440 1600">
  <defs>
    <style>
      text { font-family: 'Inter', sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="1600" fill="#f8fafc"/>

  <!-- Title Bar -->
  <rect width="1440" height="56" fill="#ffffff"/>
  <rect y="54" width="1440" height="2" fill="#cbd5e1"/>
  <text x="80" y="36" font-size="20" font-weight="700" fill="#1e40af">FIRA Interactive Elements — Light Mode</text>

  <!-- ==================== SECTION A: BUTTONS ==================== -->
  <text x="80" y="96" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.5">BUTTONS — Flat, No Gradients</text>

  <!-- A1: Button Variants -->
  <text x="80" y="124" class="mono" font-size="12" fill="#64748b" letter-spacing="1">VARIANTS</text>

  <!-- Primary Button -->
  <rect x="80" y="136" width="130" height="36" rx="8" fill="#1e40af"/>
  <text x="145" y="159" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Primary</text>
  <text x="145" y="190" class="mono" font-size="11" fill="#64748b" text-anchor="middle">bg-primary text-primary-</text>
  <text x="145" y="203" class="mono" font-size="11" fill="#64748b" text-anchor="middle">foreground shadow-xs</text>

  <!-- Secondary Button -->
  <rect x="230" y="136" width="130" height="36" rx="8" fill="#eff6ff"/>
  <text x="295" y="159" font-size="14" font-weight="500" fill="#1e3a8a" text-anchor="middle">Secondary</text>
  <text x="295" y="190" class="mono" font-size="11" fill="#64748b" text-anchor="middle">bg-secondary text-</text>
  <text x="295" y="203" class="mono" font-size="11" fill="#64748b" text-anchor="middle">secondary-foreground</text>

  <!-- Destructive Button -->
  <rect x="380" y="136" width="130" height="36" rx="8" fill="#ef4444"/>
  <text x="445" y="159" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Destructive</text>
  <text x="445" y="190" class="mono" font-size="11" fill="#64748b" text-anchor="middle">bg-destructive text-</text>
  <text x="445" y="203" class="mono" font-size="11" fill="#64748b" text-anchor="middle">destructive-foreground</text>

  <!-- Outline Button -->
  <rect x="530" y="136" width="130" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="595" y="159" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">Outline</text>
  <text x="595" y="190" class="mono" font-size="11" fill="#64748b" text-anchor="middle">border border-input bg-</text>
  <text x="595" y="203" class="mono" font-size="11" fill="#64748b" text-anchor="middle">background text-foreground</text>

  <!-- Ghost Button -->
  <rect x="680" y="136" width="100" height="36" rx="8" fill="transparent"/>
  <text x="730" y="159" font-size="14" font-weight="500" fill="#0f172a" text-anchor="middle">Ghost</text>
  <text x="730" y="190" class="mono" font-size="11" fill="#64748b" text-anchor="middle">hover:bg-accent</text>
  <text x="730" y="203" class="mono" font-size="11" fill="#64748b" text-anchor="middle">text-foreground</text>

  <!-- Link Button -->
  <rect x="800" y="136" width="80" height="36" rx="8" fill="transparent"/>
  <text x="840" y="159" font-size="14" font-weight="500" fill="#1e40af" text-anchor="middle" text-decoration="underline">Link</text>
  <text x="840" y="190" class="mono" font-size="11" fill="#64748b" text-anchor="middle">text-primary</text>
  <text x="840" y="203" class="mono" font-size="11" fill="#64748b" text-anchor="middle">underline-offset-4</text>

  <!-- A2: Button Sizes -->
  <text x="80" y="236" class="mono" font-size="12" fill="#64748b" letter-spacing="1">SIZES</text>

  <!-- Small -->
  <rect x="80" y="252" width="110" height="32" rx="8" fill="#1e40af"/>
  <text x="135" y="273" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">Small (h-8)</text>
  <text x="135" y="300" class="mono" font-size="11" fill="#64748b" text-anchor="middle">h-8 px-3 text-sm</text>

  <!-- Default -->
  <rect x="210" y="248" width="130" height="36" rx="8" fill="#1e40af"/>
  <text x="275" y="271" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Default (h-9)</text>
  <text x="275" y="300" class="mono" font-size="11" fill="#64748b" text-anchor="middle">h-9 px-4 text-sm</text>

  <!-- Large -->
  <rect x="360" y="246" width="140" height="40" rx="8" fill="#1e40af"/>
  <text x="430" y="271" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Large (h-10)</text>
  <text x="430" y="300" class="mono" font-size="11" fill="#64748b" text-anchor="middle">h-10 px-6 text-sm</text>

  <!-- Icon -->
  <rect x="520" y="248" width="36" height="36" rx="8" fill="#1e40af"/>
  <text x="538" y="272" font-size="16" font-weight="500" fill="#ffffff" text-anchor="middle">✕</text>
  <text x="538" y="300" class="mono" font-size="11" fill="#64748b" text-anchor="middle">size-9 p-0</text>

  <!-- A3: Button States -->
  <text x="80" y="336" class="mono" font-size="12" fill="#64748b" letter-spacing="1">STATES</text>

  <!-- Normal -->
  <rect x="80" y="352" width="180" height="36" rx="8" fill="#1e40af"/>
  <text x="170" y="375" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Primary</text>
  <text x="170" y="406" class="mono" font-size="11" fill="#64748b" text-anchor="middle">Default — bg-primary text-primary-</text>
  <text x="170" y="419" class="mono" font-size="11" fill="#64748b" text-anchor="middle">foreground shadow-xs</text>

  <!-- Disabled -->
  <g opacity="0.5">
    <rect x="290" y="352" width="180" height="36" rx="8" fill="#1e40af"/>
    <text x="380" y="375" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Primary</text>
  </g>
  <text x="380" y="406" class="mono" font-size="11" fill="#64748b" text-anchor="middle">Disabled — opacity-50</text>
  <text x="380" y="419" class="mono" font-size="11" fill="#64748b" text-anchor="middle">pointer-events-none</text>

  <!-- Loading -->
  <rect x="500" y="352" width="180" height="36" rx="8" fill="#1e40af"/>
  <circle cx="560" cy="370" r="8" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="12 6" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 560 370" to="360 560 370" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="605" y="375" font-size="14" font-weight="500" fill="#ffffff" opacity="0.7">Loading</text>
  <text x="590" y="406" class="mono" font-size="11" fill="#64748b" text-anchor="middle">Loading — spinner icon,</text>
  <text x="590" y="419" class="mono" font-size="11" fill="#64748b" text-anchor="middle">text hidden</text>

  <!-- A4: Press / Active State -->
  <text x="80" y="452" class="mono" font-size="12" fill="#64748b" letter-spacing="1">ACTIVE / PRESS</text>
  <g transform="translate(80,468) scale(0.98)" transform-origin="145 18">
    <rect width="180" height="36" rx="8" fill="#1e40af"/>
    <text x="90" y="23" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Active Press</text>
  </g>
  <text x="170" y="524" class="mono" font-size="11" fill="#64748b" text-anchor="middle">Active — transform: scale(0.98)</text>

  <!-- ==================== SECTION B: LINKS ==================== -->
  <text x="80" y="576" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.5">LINKS — Underline on hover only</text>

  <!-- Default Link -->
  <text x="80" y="610" font-size="14" fill="#1e40af">This is an inline link</text>
  <text x="280" y="610" class="mono" font-size="11" fill="#64748b">color: var(--primary), no underline</text>

  <!-- Hover Link -->
  <text x="80" y="650" font-size="14" fill="#1e3a8a" text-decoration="underline">This is a hovered link</text>
  <text x="300" y="650" class="mono" font-size="11" fill="#64748b">hover: underline + color: var(--primary-hover)</text>

  <!-- External Link -->
  <text x="80" y="690" font-size="14" fill="#1e40af">Visit our partners ↗</text>
  <text x="260" y="690" class="mono" font-size="11" fill="#64748b">External link — append ArrowUpRight icon</text>

  <!-- Muted Text -->
  <text x="80" y="730" font-size="14" fill="#64748b">Non-interactive text for comparison</text>
  <text x="340" y="730" class="mono" font-size="11" fill="#64748b">Not a link — text-muted-foreground</text>

  <!-- ==================== SECTION C: TABS ==================== -->
  <text x="80" y="806" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.5">TABS</text>

  <!-- Tab bar container -->
  <line x1="80" y1="860" x2="600" y2="860" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Active Tab: Overview -->
  <text x="80" y="846" font-size="14" font-weight="500" fill="#0f172a">Overview</text>
  <line x1="80" y1="858" x2="152" y2="858" stroke="#1e40af" stroke-width="2"/>
  <text x="80" y="884" class="mono" font-size="11" fill="#64748b">Active — border-b-2 border-primary font-medium</text>

  <!-- Inactive Tab: Applications -->
  <text x="200" y="846" font-size="14" fill="#64748b">Applications</text>
  <text x="200" y="884" class="mono" font-size="11" fill="#64748b">Inactive — text-muted-foreground</text>

  <!-- Inactive Tab: Settings -->
  <text x="340" y="846" font-size="14" fill="#64748b">Settings</text>
  <text x="340" y="884" class="mono" font-size="11" fill="#64748b">Inactive — hover: text-foreground</text>

  <!-- ===== Interactive Demo: Tabs in Context ===== -->
  <text x="80" y="936" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.5">TABS — IN CONTEXT</text>

  <!-- Tab bar card -->
  <rect x="80" y="952" width="500" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Context tabs -->
  <line x1="80" y1="1000" x2="580" y2="1000" stroke="#cbd5e1" stroke-width="1"/>
  <text x="104" y="988" font-size="14" font-weight="500" fill="#0f172a">Overview</text>
  <line x1="96" y1="998" x2="172" y2="998" stroke="#1e40af" stroke-width="2"/>
  <text x="196" y="988" font-size="14" fill="#64748b">Analytics</text>
  <text x="296" y="988" font-size="14" fill="#64748b">Reports</text>
  <text x="380" y="988" font-size="14" fill="#64748b">Settings</text>

  <!-- Tab content area -->
  <text x="104" y="1034" font-size="13" font-weight="600" fill="#0f172a">Dashboard Overview</text>
  <text x="104" y="1058" font-size="13" fill="#64748b">Welcome back. Here's a summary of your</text>
  <text x="104" y="1078" font-size="13" fill="#64748b">project activity for this week.</text>

  <!-- Mini stat cards inside tab content -->
  <rect x="104" y="1096" width="130" height="60" rx="8" fill="#eff6ff"/>
  <text x="114" y="1116" font-size="11" fill="#64748b">Total Users</text>
  <text x="114" y="1142" font-size="20" font-weight="700" fill="#1e40af">2,847</text>

  <rect x="248" y="1096" width="130" height="60" rx="8" fill="#f0fdf4"/>
  <text x="258" y="1116" font-size="11" fill="#64748b">Revenue</text>
  <text x="258" y="1142" font-size="20" font-weight="700" fill="#22c55e">$12.4k</text>

  <rect x="392" y="1096" width="130" height="60" rx="8" fill="#fffbeb"/>
  <text x="402" y="1116" font-size="11" fill="#64748b">Pending</text>
  <text x="402" y="1142" font-size="20" font-weight="700" fill="#f59e0b">38</text>

  <!-- Mini action buttons inside tab -->
  <rect x="104" y="1172" width="120" height="36" rx="8" fill="#1e40af"/>
  <text x="164" y="1195" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">View All</text>
  <rect x="236" y="1172" width="120" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="296" y="1195" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">Export</text>

  <!-- ===== Button Group Demo ===== -->
  <text x="80" y="1280" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.5">BUTTON GROUP</text>

  <g transform="translate(80, 1296)">
    <!-- Button group container -->
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#1e40af"/>
    <text x="18" y="23" font-size="16" fill="#ffffff" text-anchor="middle">−</text>
    <rect x="36" y="0" width="60" height="36" fill="#1e40af"/>
    <text x="66" y="23" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="96" y="0" width="36" height="36" rx="8" fill="#1e40af"/>
    <text x="114" y="23" font-size="16" fill="#ffffff" text-anchor="middle">+</text>
    <text x="66" y="58" class="mono" font-size="11" fill="#64748b" text-anchor="middle">Inline button group</text>
  </g>

  <!-- Button with icon example -->
  <g transform="translate(280, 1296)">
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#1e40af"/>
    <text x="24" y="23" font-size="14" fill="#ffffff">↓</text>
    <text x="44" y="23" font-size="14" font-weight="500" fill="#ffffff">Download CSV</text>
    <text x="80" y="58" class="mono" font-size="11" fill="#64748b" text-anchor="middle">Button with icon + label</text>
  </g>

  <!-- Icon-only buttons -->
  <g transform="translate(500, 1296)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="transparent" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="24" font-size="16" fill="#0f172a" text-anchor="middle">✎</text>
    <rect x="44" y="0" width="36" height="36" rx="8" fill="transparent" stroke="#cbd5e1" stroke-width="1"/>
    <text x="62" y="24" font-size="16" fill="#0f172a" text-anchor="middle">✕</text>
    <rect x="88" y="0" width="36" height="36" rx="8" fill="transparent" stroke="#cbd5e1" stroke-width="1"/>
    <text x="106" y="24" font-size="16" fill="#0f172a" text-anchor="middle">⋯</text>
    <text x="62" y="58" class="mono" font-size="11" fill="#64748b" text-anchor="middle">Icon-only buttons (outline)</text>
  </g>

  <!-- ===== Keyboard Shortcuts ===== -->
  <text x="80" y="1400" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.5">KEYBOARD SHORTCUT HINTS</text>

  <text x="80" y="1430" font-size="14" fill="#0f172a">Save changes</text>
  <g transform="translate(220, 1416)">
    <rect width="24" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="16" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle" class="mono">⌘</text>
    <text x="34" y="16" font-size="12" fill="#64748b">+</text>
    <rect x="48" y="0" width="24" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="60" y="16" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle" class="mono">S</text>
  </g>
  <text x="340" y="1430" class="mono" font-size="11" fill="#64748b">kbd + kbd inline</text>

  <text x="80" y="1470" font-size="14" fill="#0f172a">Undo action</text>
  <g transform="translate(220, 1456)">
    <rect width="24" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="16" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle" class="mono">⌘</text>
    <text x="34" y="16" font-size="12" fill="#64748b">+</text>
    <rect x="48" y="0" width="24" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="60" y="16" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle" class="mono">Z</text>
  </g>
  <text x="340" y="1470" class="mono" font-size="11" fill="#64748b">Keyboard shortcut badges</text>

  <!-- Footer note -->
  <text x="80" y="1560" class="mono" font-size="11" fill="#94a3b8">All interactive elements use focus-visible:ring-2 ring-ring ring-offset-2 for accessibility. Buttons: cursor-pointer. Transitions: transition-colors 150ms.</text>
</svg>